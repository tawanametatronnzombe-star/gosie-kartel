<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gosie Kartel | Premium Streetwear</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Sticky Header Navigation -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">Gosie Kartel</a>
            <nav>
                <ul style="display: flex; gap: 15px; list-style: none; margin: 0; padding: 0;">
                    <li><a href="index.html" style="color: #fff; text-decoration: none;">HOME</a></li>
                    <li><a href="shop.html" style="color: #a0aec0; text-decoration: none;">SHOP</a></li>
                    <li><a href="track-order.html" style="color: #a0aec0; text-decoration: none;">TRACK</a></li>
                    <li><a href="feedback.html" style="color: #a0aec0; text-decoration: none;">FEEDBACK</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content Container -->
    <main style="max-width: 1200px; margin: 0 auto; padding: 0 15px;">
        <!-- Hero Section (Fixed Left Margin Off-Screen Shift) -->
        <section class="hero-container" style="background: #161b22; border-radius: 12px; padding: 40px 20px; text-align: center; margin-bottom: 40px; border: 1px solid #30363d;">
            <div style="max-width: 600px; margin: 0 auto;">
                <span style="background: rgba(13, 110, 253, 0.2); color: #0d6efd; padding: 5px 12px; border-radius: 20px; font-weight: 600; font-size: 0.85em; display: inline-block; margin-bottom: 15px;">NEW COLLECTION</span>
                <h1 style="font-size: 2.2em; font-weight: 900; margin-bottom: 15px; text-transform: uppercase;">GOSIE KARTEL</h1>
                <p style="color: #a0aec0; font-size: 1em; line-height: 1.5; margin-bottom: 25px;">Premium winter streetwear tailored for urban culture.</p>
                
                <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                    <a href="shop.html" class="payment-method-btn" style="background: #0d6efd; padding: 12px 24px; text-decoration: none; font-weight: 600; border: none; min-width: 140px;">SHOP NOW</a>
                    <a href="shop.html" class="payment-method-btn" style="padding: 12px 24px; text-decoration: none; font-weight: 600; min-width: 140px;">LEARN MORE</a>
                </div>
            </div>
        </section>

        <!-- Featured Products Preview -->
        <section style="margin-bottom: 40px;">
            <h2 style="font-size: 1.5em; margin-bottom: 20px; text-transform: uppercase;">Featured Arrivals</h2>
            
            <div id="shop-products" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
                <!-- Product cards render here automatically via products.js -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Gosie Kartel | All prices in USD.</p>
        <p class="footer-email">Contact: tawanametatronnzombe@gmail.com</p>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
</body>
                        </html>
