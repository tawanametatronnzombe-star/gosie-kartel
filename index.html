    <!-- Internal CSS (checkout.html Design System Match & GAP OVERRIDE FIX) -->
    <style>
      :root{
        --bg:#0e1016; 
        --surface:#161a24; 
        --surface-2:#1d2230; 
        --line:#2a3142;
        --text:#eef1f7; 
        --muted:#98a1b5; 
        --brand:#4ade9b; 
        --brand-2:#38bdf8;
        --radius:14px; 
        --shadow:0 10px 30px rgba(0,0,0,.35);
        --font:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
      }
      
      /* Global Layout Reset Overrides to eliminate big left gaps caused by style1-style6 */
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        overflow-x: hidden !important;
      }

      *, *::before, *::after {
        box-sizing: border-box !important;
      }

      body {
        background: radial-gradient(1200px 600px at 80% -10%,#1b2536,transparent), var(--bg);
        color: var(--text);
        font-family: var(--font);
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      a {
        color: var(--brand-2);
        text-decoration: none;
      }

      /* Navbar matching topbar layout & glassmorphism */
      .navbar {
        position: sticky;
        top: 0;
        z-index: 100;
        backdrop-filter: blur(10px);
        background: rgba(14,16,22,.8);
        border-bottom: 1px solid var(--line);
        width: 100% !important;
        left: 0 !important;
        margin: 0 !important;
      }

      .nav-container {
        max-width: 1180px;
        margin: 0 auto !important;
        padding: 0 18px;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 64px;
      }

      .navbar .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        letter-spacing: .3px;
        color: var(--text);
        font-size: 16px;
      }

      .navbar .logo::before {
        content: "";
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--brand), var(--brand-2));
        display: inline-block;
      }

      .nav-menu {
        list-style: none;
        display: flex;
        gap: 20px;
        margin: 0;
        padding: 0;
        align-items: center;
      }

      .nav-menu li a {
        color: var(--muted);
        font-size: 13.5px;
        font-weight: 600;
        transition: color .2s ease;
      }

      .nav-menu li a:hover {
        color: var(--text);
      }

      /* Hero Section centered without off-screen shift */
      .hero {
        flex: 1;
        max-width: 1180px;
        margin: 0 auto !important;
        padding: 40px 18px 60px;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        float: none !important;
        left: 0 !important;
        right: 0 !important;
      }

      .hero-content {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 40px 30px;
        box-shadow: var(--shadow);
        width: 100%;
        max-width: 720px;
        text-align: center;
        margin: 0 auto !important;
      }

      .hero-badge {
        display: inline-block;
        font-size: 11.5px;
        color: var(--brand);
        border: 1px solid var(--brand);
        background: rgba(74, 222, 155, 0.08);
        border-radius: 999px;
        padding: 4px 12px;
        font-weight: 700;
        margin-bottom: 16px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .hero-title {
        margin: 0 0 10px;
        font-size: clamp(28px, 5vw, 42px);
        font-weight: 800;
        letter-spacing: -0.5px;
        color: var(--text);
      }

      .hero-subtitle {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 15px;
      }

      .hero-buttons {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      /* Buttons matching checkout style buttons */
      .btn {
        border: 0;
        border-radius: 11px;
        padding: 12px 24px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
        transition: .18s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--brand), var(--brand-2));
        color: #062017;
      }

      .btn-primary:hover {
        filter: brightness(1.07);
      }

      .btn-secondary {
        background: var(--surface-2);
        color: var(--text);
        border: 1px solid var(--line);
      }

      .btn-secondary:hover {
        background: #272e40;
      }

      /* Fixed footer styling */
      footer {
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12.5px;
        line-height: 1.6;
        padding: 24px 18px calc(70px + env(safe-area-inset-bottom)) !important;
        text-align: center;
        width: 100% !important;
        margin-top: auto !important;
        margin-bottom: 0 !important;
        word-break: break-word;
        overflow-wrap: anywhere;
        box-sizing: border-box !important;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      @media (max-width: 580px) {
        .nav-container {
          padding: 0 12px;
        }
        .nav-menu {
          gap: 12px;
        }
        .nav-menu li a {
          font-size: 12.5px;
        }
        .hero {
          padding: 20px 12px 40px;
        }
        .hero-content {
          padding: 28px 18px;
        }
        .hero-buttons {
          flex-direction: column;
        }
        .btn {
          width: 100%;
        }
      }
    </style>
