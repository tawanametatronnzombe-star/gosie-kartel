    <!-- Internal CSS -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root {
        --dark-bg: #0a0e27;
        --card-bg: #111a3a;
        --accent-primary: #00a8ff;
        --accent-secondary: #3db8ff;
        --accent-light: #6fd4ff;
        --text-primary: #ffffff;
        --text-secondary: #e0e6ff;
        --text-muted: #99a5d0;
        --border-subtle: #1e2e5e;
      }
      
      body { 
        margin: 0; 
        font-family: 'Montserrat', sans-serif; 
        background: var(--dark-bg); 
        color: var(--text-primary);
        overflow-x: hidden;
      }
      
      /* Navigation */
      .navbar { 
        background: rgba(10, 14, 39, 0.95);
        backdrop-filter: blur(10px);
        padding: 15px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border-subtle);
        position: sticky;
        top: 0;
        z-index: 100;
      }
      
      .navbar .logo { 
        color: var(--accent-primary);
        font-weight: 800;
        font-size: 1.5em;
        text-decoration: none;
        letter-spacing: 2px;
        text-transform: uppercase;
        animation: glow 2s ease-in-out infinite;
      }

      @keyframes glow {
        0%, 100% { text-shadow: 0 0 20px rgba(0, 168, 255, 0.5); }
        50% { text-shadow: 0 0 40px rgba(0, 168, 255, 0.8); }
      }
      
      .nav-menu { 
        list-style: none;
        display: flex;
        gap: 30px;
        margin: 0;
        padding: 0;
      }
      
      .nav-menu li a { 
        color: var(--text-secondary);
        text-decoration: none;
        font-weight: 600;
        transition: all 0.3s ease;
        font-size: 0.95em;
        letter-spacing: 0.5px;
        position: relative;
      }

      .nav-menu li a::after {
        content: '';
        position: absolute;
        bottom: -5px;
        left: 0;
        width: 0;
        height: 2px;
        background: var(--accent-primary);
        transition: width 0.3s ease;
      }

      .nav-menu li a:hover::after { 
        width: 100%;
      }
      
      .nav-menu li a:hover { 
        color: var(--accent-primary);
      }
      
      .nav-menu li a.active { 
        color: var(--accent-primary);
      }

      .nav-menu li a.active::after {
        width: 100%;
      }
      
      .hamburger { 
        display: none;
        flex-direction: column;
        gap: 5px;
        cursor: pointer;
      }
      
      .hamburger span { 
        display: block;
        width: 25px;
        height: 2.5px;
        background: var(--accent-primary);
        border-radius: 2px;
        transition: all 0.3s ease;
      }
      
      /* Hero Section - Enhanced */
      .hero { 
        position: relative;
        text-align: center;
        padding: 140px 20px 120px;
        background: linear-gradient(135deg, #0a0e27 0%, #111a3a 100%);
        color: var(--text-primary);
        border-bottom: 2px solid var(--accent-primary);
        overflow: hidden;
        min-height: 85vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .hero::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: radial-gradient(circle at 20% 50%, rgba(0, 168, 255, 0.1) 0%, transparent 50%),
                    radial-gradient(circle at 80% 80%, rgba(61, 184, 255, 0.1) 0%, transparent 50%);
        pointer-events: none;
      }

      .hero-content {
        position: relative;
        z-index: 2;
        animation: slideUp 1s ease-out;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      .hero .hero-badge { 
        background: var(--accent-primary);
        display: inline-block;
        padding: 10px 24px;
        border-radius: 50px;
        font-weight: 700;
        margin-bottom: 20px;
        color: #0a0e27;
        font-size: 0.9em;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        box-shadow: 0 8px 20px rgba(0, 168, 255, 0.3);
        animation: bounce 3s infinite;
      }

      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      
      .hero .hero-title { 
        font-size: 4.5em;
        margin: 20px 0;
        font-weight: 900;
        letter-spacing: 4px;
        text-transform: uppercase;
        background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.1;
        animation: titleGlow 2s ease-in-out infinite;
      }

      @keyframes titleGlow {
        0%, 100% {
          filter: drop-shadow(0 0 20px rgba(0, 168, 255, 0.3));
        }
        50% {
          filter: drop-shadow(0 0 40px rgba(0, 168, 255, 0.5));
        }
      }
      
      .hero .hero-subtitle { 
        font-size: 1.3em;
        margin-bottom: 40px;
        color: var(--text-secondary);
        font-weight: 400;
        letter-spacing: 0.8px;
        max-width: 700px;
        margin-left: auto;
        margin-right: auto;
      }
      
      /* Hero Buttons - Enhanced */
      .hero-buttons {
        display: flex;
        flex-direction: column;
        gap: 15px;
        align-items: center;
      }
      
      .hero-buttons a { 
        text-decoration: none;
        padding: 16px 45px;
        border-radius: 8px;
        font-weight: 700;
        transition: all 0.3s ease;
        width: 220px;
        text-align: center;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        font-size: 0.95em;
        position: relative;
        overflow: hidden;
      }
      
      @media (min-width: 601px) {
        .hero-buttons {
          flex-direction: row;
          gap: 25px;
          justify-content: center;
        }
