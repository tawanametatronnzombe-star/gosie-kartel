<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order | Gosie Kartel</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        .orders-section { padding: 40px 20px; text-align: center; }
        .order-lookup { margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .order-lookup input { padding: 10px; width: 250px; border-radius: 5px; border: 1px solid #ccc; }
        .order-lookup button { padding: 10px 20px; border-radius: 5px; border: none; background-color: #0d6efd; color: white; cursor: pointer; }
        #order-status { margin-top: 20px; font-weight: bold; font-size: 1.1em; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Gosie Kartel</a>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="orders.html" class="active">Track Order</a></li>
            </ul>
        </div>
    </nav>

    <section class="orders-section">
        <div class="container">
            <h1>Track Your Order</h1>
            <div class="order-lookup">
                <input type="text" id="order-id" placeholder="Enter Order ID">
                <input type="email" id="order-email" placeholder="Enter Your Email">
                <button class="btn btn-primary" onclick="trackOrder()">Track Order</button>
            </div>
            <div id="order-status"></div>
        </div>
    </section>

    <script>
        // Dummy orders for testing
        const orders = [
            { orderId: "1001", email: "customer1@example.com", status: "Processing" },
            { orderId: "1002", email: "customer2@example.com", status: "Shipped" },
            { orderId: "1003", email: "customer3@example.com", status: "Delivered" }
        ];

        function trackOrder() {
            const orderId = document.getElementById("order-id").value.trim();
            const email = document.getElementById("order-email").value.trim().toLowerCase();
            const statusDiv = document.getElementById("order-status");

            if (!orderId || !email) {
                statusDiv.textContent = "Please enter both Order ID and Email.";
                statusDiv.style.color = "red";
                return;
            }

            const order = orders.find(o => o.orderId === orderId && o.email.toLowerCase() === email);

            if (order) {
                statusDiv.textContent = `Order Found! Status: ${order.status}`;
                statusDiv.style.color = "green";
            } else {
                statusDiv.textContent = "Order not found. Please check your Order ID and Email.";
                statusDiv.style.color = "red";
            }
        }
    </script>
</body>
</html>
