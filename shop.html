<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | Gosie Kartel</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">Gosie Kartel</a>
            <nav>
                <ul style="display: flex; gap: 15px; list-style: none; margin: 0; padding: 0;">
                    <li><a href="index.html" style="color: #a0aec0; text-decoration: none;">HOME</a></li>
                    <li><a href="shop.html" style="color: #fff; text-decoration: none;">SHOP</a></li>
                    <li><a href="cart.html" style="color: #a0aec0; text-decoration: none;">CART (<span id="cart-count">0</span>)</a></li>
                    <li><a href="track-order.html" style="color: #a0aec0; text-decoration: none;">TRACK</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main style="max-width: 1200px; margin: 0 auto; padding: 0 15px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <h1 style="font-size: 2em; text-transform: uppercase;">Shop Catalog</h1>
            <select id="category-filter" class="form-group" style="width: auto; padding: 8px 12px; background: #161b22; color: #fff; border: 1px solid #30363d; border-radius: 6px;">
                <option value="all">All Categories</option>
                <option value="hoodies">Hoodies</option>
                <option value="tracksuits">Tracksuits</option>
                <option value="accessories">Accessories</option>
            </select>
        </div>

        <div id="shop-products" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding-bottom: 40px;">
            <!-- Rendered dynamically by products.js -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Gosie Kartel | All prices in USD.</p>
        <p class="footer-email">Contact: tawanametatronnzombe@gmail.com</p>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
