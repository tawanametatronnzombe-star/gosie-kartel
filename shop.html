<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | Gosie Kartel</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Gosie Kartel</a>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html" class="active">Shop</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="cart.html" class="cart-icon">🛒 <span id="cart-count">0</span></a></li>
            </ul>
        </div>
    </nav>

    <section class="page-header">
        <h1>Shop All Products</h1>
        <p>Discover our latest winter collection</p>
    </section>

    <section class="shop-section">
        <div class="container">
            <div class="shop-filters">
                <select id="category-filter" class="filter-select">
                    <option value="all">All Categories</option>
                    <option value="hoodies">Hoodies</option>
                    <option value="tracksuits">Tracksuits</option>
                    <option value="accessories">Accessories</option>
                </select>
                <select id="sort-filter" class="filter-select">
                    <option value="default">Sort By</option>
                    <option value="price-low">Price: Low to High</option>
                    <option value="price-high">Price: High to Low</option>
                    <option value="name">Name</option>
                </select>
            </div>
            <div class="products-grid" id="shop-products"></div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Gosie Kartel | Contact: tawanametatronnzombe@gmail.com</p>
            </div>
        </div>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
