<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback | Gosie Kartel</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background:#f9f9f9; margin:0; padding:0; }
        .feedback-section { padding: 60px 20px; max-width: 700px; margin: 0 auto; }
        h1 { font-size: 2.2em; margin-bottom: 10px; text-align:center; }
        .section-subtitle { text-align:center; font-size:1em; margin-bottom: 30px; color:#555; }
        .feedback-form { display: flex; flex-direction: column; gap:15px; }
        .feedback-form input, .feedback-form select, .feedback-form textarea {
            padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 1em; width: 100%; box-sizing: border-box;
        }
        .btn-large { padding: 12px; font-size:1.1em; border:none; border-radius:8px; background:#0d6efd; color:#fff; cursor:pointer; }
        .stars { display:flex; gap:5px; justify-content:center; font-size:1.8em; cursor:pointer; }
        .stars span { color:#ccc; transition: color 0.2s; }
        .success-message h2 { color:#0d6efd; margin-bottom:10px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Gosie Kartel</a>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="feedback.html" class="active">Feedback</a></li>
            </ul>
        </div>
    </nav>

    <section class="feedback-section">
        <h1>Send Us Feedback</h1>
        <p class="section-subtitle">We'd love to hear from you! Your feedback helps us improve.</p>
        <form id="feedback-form" class="feedback-form">
            <input type="text" id="feedback-name" placeholder="Your Name *" required>
            <input type="email" id="feedback-email" placeholder="Your Email *" required>
            <select id="feedback-type" required>
                <option value="">Select Feedback Type *</option>
                <option value="product">Product Feedback</option>
                <option value="service">Customer Service</option>
                <option value="shipping">Shipping Experience</option>
                <option value="other">Other</option>
            </select>
            <textarea id="feedback-message" rows="6" placeholder="Your Message *" required></textarea>
            <div class="rating" id="rating">
                <label style="display:block; text-align:center; margin-bottom:5px;">Rate Your Experience:</label>
                <div class="stars">
                    <span data-rating="1">★</span>
                    <span data-rating="2">★</span>
                    <span data-rating="3">★</span>
                    <span data-rating="4">★</span>
                    <span data-rating="5">★</span>
                </div>
                <input type="hidden" id="rating-value" value="0">
            </div>
            <button type="submit" class="btn btn-primary btn-large">Send Feedback</button>
        </form>
        <div id="feedback-success" class="success-message" style="display:none; text-align:center;">
            <h2>Thank You!</h2>
            <p>Your email client was launched to deliver your feedback directly to tawanametatronnzombe@gmail.com.</p>
        </div>
    </section>

    <script>
        document.getElementById('feedback-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('feedback-name').value;
            const email = document.getElementById('feedback-email').value;
            const type = document.getElementById('feedback-type').value;
            const message = document.getElementById('feedback-message').value;
            const rating = document.getElementById('rating-value').value;

            const subject = encodeURIComponent(`Feedback from ${name} - ${type}`);
            const body = encodeURIComponent(
                `Name: ${name}%0D%0A` +
                `Email: ${email}%0D%0A` +
                `Type: ${type}%0D%0A` +
                `Rating: ${rating}/5%0D%0A%0D%0A` +
                `Message:%0D%0A${message}`
            );

            window.location.href = `mailto:tawanametatronnzombe@gmail.com?subject=${subject}&body=${body}`;

            document.getElementById('feedback-form').style.display = 'none';
            document.getElementById('feedback-success').style.display = 'block';
        });

        const stars = document.querySelectorAll('.stars span');
        stars.forEach(star => {
            star.addEventListener('click', function() {
                const rating = this.getAttribute('data-rating');
                document.getElementById('rating-value').value = rating;
                stars.forEach((s, i) => {
                    s.style.color = i < rating ? '#00FFFF' : '#ccc';
                });
            });
        });
    </script>
</body>
</html>
