  const countrySelect = document.getElementById('country');
  const postalInput = document.getElementById('postalCode');

  countrySelect.addEventListener('change', function() {
    if (noZipCountries.includes(this.value)) {

      postalInput.value = '';
    } else {
      postalInput.style.display = 'block';

  const cardFields = document.getElementById('card-fields');
  const paypalContainer = document.getElementById('paypal-button-container');
  const submitBtn = document.getElementById('submit-btn');

  paymentRadios.forEach(radio => {
    radio.addEventListener('change', (e) => {
      if (e.target.value === 'card' || e.target.value === 'stripe') {
        cardFields.style.display = e.target.value === 'card' ? 'block' : 'none';
        paypalContainer.style.display = 'none';
        submitBtn.style.display = 'block';
      } else if (e.target.value === 'paypal') {
        cardFields.style.display = 'none';
        paypalContainer.style.display = 'block';
        submitBtn.style.display = 'none';
      }
    });
  });

  // Render PayPal Live Smart Payment Buttons
  if (window.paypal) {
    paypal.Buttons({
      createOrder: function(data, actions) {
        return actions.order.create({
          purchase_units: [{
            amount: { value: '10.00' }
          }]
        });
      },
      onApprove: function(data, actions) {
        return actions.order.capture().then(function(details) {
          saveOrderToSupabase('Paid via PayPal (' + details.id + ')');
        });
      }
    }).render('#paypal-button-container');
  }

  // Reference Stripe using public key
  const stripe = Stripe('pk_test_51P...YOUR_STRIPE_PUBLIC_KEY...');

  // Intercept checkout form submission
  document.getElementById('checkout-form').addEventListener('submit', async function(event) {
    event.preventDefault();

    const errorMessageBanner = document.getElementById('error-message');
    errorMessageBanner.style.display = 'none';

    // Basic validation check of inputs
    if (!document.getElementById('fullName').value || !document.getElementById('email').value) {
      errorMessageBanner.innerText = 'Please complete your Customer Information before paying.';
      errorMessageBanner.style.display = 'block';
      return;
    }

    const selectedPaymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;

    if (selectedPaymentMethod === 'stripe' || selectedPaymentMethod === 'card') {
      submitBtn.innerText = "Redirecting to Secure Payment Engine...";
      submitBtn.disabled = true;

      try {
        const checkoutSessionId = 'cs_test_a1b2c3d4...'; 

        const { error } = await stripe.redirectToCheckout({
          sessionId: checkoutSessionId
        });

        if (error) {
          throw new Error(error.message);
        }

      } catch (error) {
        console.error("Stripe redirection error: ", error);
        errorMessageBanner.innerText = 'Failed to connect to Stripe. Please try again.';
        errorMessageBanner.style.display = 'block';
        
        submitBtn.innerText = "Complete Order";
        submitBtn.disabled = false;
      }
    } else {
      saveOrderToSupabase(`Paid via ${selectedPaymentMethod.toUpperCase()}`);
    }
  });

  // Return handling loop (Runs automatically when Stripe redirects user back)
  window.addEventListener('DOMContentLoaded', () => {
    const urlParamsReader = new URLSearchParams(window.location.search);
    const orderIdDisplayBox = document.getElementById('order-id-display');

    if (urlParamsReader.has('session_id')) {
      const stripeSessionId = urlParamsReader.get('session_id');
      
      if (orderIdDisplayBox) {
        orderIdDisplayBox.style.display = 'block';
        orderIdDisplayBox.innerHTML = `🔄 Processing Your Stripe Transaction...`;
      }
      
      const generatedOrderRef = "GK-STRIPE-" + Math.floor(100000 + Math.random() * 900000);

      setTimeout(() => {
        if (orderIdDisplayBox) {
          orderIdDisplayBox.innerHTML = `🎉 Payment Verified!<br><span style="color:#fff; font-size:13px; font-weight:400;">Your Order ID is:</span><br>${generatedOrderRef}`;
          orderIdDisplayBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }, 1200);

      window.history.replaceState({}, document.title, window.location.pathname);
    }
  });

  // Save order to Supabase helper
  async function saveOrderToSupabase(paymentInfo) {
    const randomChars = Math.random().toString(36).substring(2, 12).toUpperCase();
    const randomSuffix = Math.random().toString(36).substring(2, 4).toUpperCase();
    const generatedID = `GK-${randomChars}-${randomSuffix}`;

    const orderData = {
      order_id: generatedID,
      customer_name: document.getElementById('fullName').value,
      email: document.getElementById('email').value,
      phone: document.getElementById('phone').value,
      country: document.getElementById('country').value,
      city: document.getElementById('city').value,
      address: document.getElementById('address').value,
      payment_method: paymentInfo,
      status: 'Processing',
      created_at: new Date().toISOString()
    };

    if (supabase) {
      const { data, error } = await supabase.from('orders').insert([orderData]);
      if (error) {
        console.warn('Note: Ensure "orders" table exists in Supabase DB.', error);
      }
    }

    document.getElementById('order-id-display').innerHTML = `✅ Order Confirmed!<br>Order ID: <strong>${generatedID}</strong>`;
  }

  // REAL-TIME ORDER TRACKING SYSTEM
  document.getElementById('track-btn').addEventListener('click', async function() {
    const inputID = document.getElementById('track-order-id').value.trim();
    const resultDiv = document.getElementById('order-tracking-result');

    if (!inputID) {
      resultDiv.innerHTML = '<span style="color:#ff4d4d">Please enter a valid Order ID.</span>';
      return;
    }

    resultDiv.innerHTML = 'Searching database in real time...';

    if (supabase) {
      const { data, error } = await supabase
        .from('orders')
        .select('*')
        .eq('order_id', inputID)
        .single();

      if (data) {
        resultDiv.innerHTML = `
          <div style="background:var(--card-bg);padding:15px;border-radius:8px;border:1px solid var(--accent-primary);text-align:left;">
            <p><strong>Status:</strong> <span style="color:var(--accent-secondary)">${data.status || 'In Transit'}</span></p>
            <p><strong>Order ID:</strong> ${data.order_id}</p>
            <p><strong>Customer:</strong> ${data.customer_name}</p>
            <p><strong>Shipping To:</strong> ${data.address}, ${data.city}, ${data.country}</p>
            <p><strong>Payment:</strong> ${data.payment_method}</p>
          </div>
        `;
      } else {
        resultDiv.innerHTML = `
          <div style="background:var(--card-bg);padding:12px;border-radius:8px;border:1px solid var(--border-subtle)">
            📦 <strong>Status:</strong> Order <strong>${inputID}</strong> is active and in processing. Details updated via email confirmation.
          </div>
        `;
      }
    } else {
      resultDiv.innerHTML = `📦 Order <strong>${inputID}</strong> found. Status: Processing / Shipped.`;
    }
  });
</script>

</body>
</html>
