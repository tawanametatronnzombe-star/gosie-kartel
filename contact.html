    margin-bottom: 15px;
    border-radius: 8px;

    font-size: 1em;
    transition: border 0.3s;
}
.contact-form input:focus,
.contact-form textarea:focus {
    border-color: #0d6efd;
    outline: none;
}

.contact-form button {
    background: #0d6efd;
    color: #fff;
    border: none;
    padding: 12px 20px;
    font-size: 1em;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.3s;
}
.contact-form button:hover {
    background: #0b5ed7;
}

@media(max-width: 900px) {
    .contact-grid {

}

<script>
function sendContactEmail(e) {
    e.preventDefault();
    const name = document.getElementById('contact-name').value;
    const email = document.getElementById('contact-email').value;
    const subject = document.getElementById('contact-subject').value;
    const message = document.getElementById('contact-message').value;

    const mailtoLink = `mailto:tawanametatronnzombe@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(`Name: ${name}\nEmail: ${email}\n\nMessage:\n${message}`)}`;
    window.location.href = mailtoLink;

    alert("Your message is ready to send via your email client.");
}
</script>
