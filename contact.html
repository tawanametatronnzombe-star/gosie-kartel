<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Gosie Kartel</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Gosie Kartel</a>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </div>
    </nav>

    <section class="contact-section">
        <div class="container">
            <h1>Get In Touch</h1>
            <div class="contact-grid">
                <div class="contact-info">
                    <h3>Contact Information</h3>
                    <div class="contact-item">
                        <span class="icon">📧</span>
                        <div>
                            <h4>Email</h4>
                            <a href="mailto:tawanametatronnzombe@gmail.com">tawanametatronnzombe@gmail.com</a>
                        </div>
                    </div>
                    <div class="contact-item">
                        <span class="icon">📱</span>
                        <div>
                            <h4>Social Media</h4>
                            <p>Instagram: <a href="https://instagram.com/Metatron8788" target="_blank">@Metatron8788</a></p>
                            <p>TikTok: <a href="https://tiktok.com/@Metatron8788" target="_blank">@Metatron8788</a></p>
                        </div>
                    </div>
                    <div class="contact-item">
                        <span class="icon">🕐</span>
                        <div>
                            <h4>Business Hours</h4>
                            <p>Monday - Friday: 9AM - 6PM</p>
                            <p>Saturday: 10AM - 4PM</p>
                        </div>
                    </div>
                </div>
                <form class="contact-form" onsubmit="sendContactEmail(event)">
                    <h3>Send Us a Message</h3>
                    <input type="text" id="contact-name" placeholder="Your Name" required>
                    <input type="email" id="contact-email" placeholder="Your Email" required>
                    <input type="text" id="contact-subject" placeholder="Subject" required>
                    <textarea id="contact-message" rows="5" placeholder="Your Message" required></textarea>
                    <button type="submit" class="btn btn-primary btn-large">Send Message</button>
                </form>
            </div>
        </div>
    </section>

    <script>
        function sendContactEmail(e) {
            e.preventDefault();
            const name = document.getElementById('contact-name').value;
            const email = document.getElementById('contact-email').value;
            const subject = document.getElementById('contact-subject').value;
            const message = document.getElementById('contact-message').value;
            
            const mailtoLink = `mailto:tawanametatronnzombe@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(`Name: ${name}\nEmail: ${email}\n\nMessage:\n${message}`)}`;
            window.location.href = mailtoLink;
        }
    </script>
</body>
</html>
