<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Checkout — Gosie Kartel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060606;
  --bg2:#0a0a0a;
  --card:#0d0d0d;
  --card2:#111;
  --border:#1c1c1c;
  --border2:#242424;
  --gold:#c9a84c;
  --gold2:#d4b460;
  --gold-dim:rgba(201,168,76,.1);
  --gold-glow:rgba(201,168,76,.18);
  --white:#f0f0f0;
  --white2:#b8b8b8;
  --gray:#6a6a6a;
  --gray2:#3a3a3a;
  --error:#cf4f4f;
  --success:#4caf7a;
  --r:8px;
  --rs:5px;
}
html{scroll-behavior:smooth}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--white);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* ── HEADER ── */
header{
  position:sticky;top:0;z-index:100;
  background:rgba(6,6,6,.92);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}
.header-inner{
  max-width:1160px;margin:0 auto;padding:0 28px;
  height:64px;display:flex;align-items:center;justify-content:space-between;
}
.logo{display:flex;align-items:center;gap:11px;text-decoration:none}
.logo-mark{
  width:36px;height:36px;background:var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-weight:700;font-size:13px;
  letter-spacing:.04em;color:#060606;flex-shrink:0;
}
.logo-name{
  font-family:'Oswald',sans-serif;font-weight:700;
  font-size:18px;letter-spacing:.18em;color:var(--white);
  text-transform:uppercase;
}

/* ── LAYOUT ── */
main{max-width:1160px;margin:32px auto 80px;padding:0 28px}
.checkout-grid{display:grid;grid-template-columns:1fr 400px;gap:32px}
@media(max-width:920px){.checkout-grid{grid-template-columns:1fr}}

.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);padding:24px;margin-bottom:24px;
}
.card-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.card-header-num{
  width:26px;height:26px;border-radius:50%;background:var(--gold-dim);
  border:1px solid var(--gold);color:var(--gold);display:flex;
  align-items:center;justify-content:center;font-size:12px;font-weight:600;
}
.card-title{font-family:'Oswald',sans-serif;font-size:18px;letter-spacing:.08em;text-transform:uppercase}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-grid.full{grid-template-columns:1fr}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--white2);font-weight:500}
.field input, .field select{
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:var(--rs);padding:12px 14px;color:var(--white);
  font-family:'DM Sans',sans-serif;font-size:14px;outline:none;
  transition:border-color .2s;
}
.field input:focus, .field select:focus{border-color:var(--gold)}
.field select option{background:var(--bg2);color:var(--white)}

/* Order Summary Items */
.summary-item{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border)}
.summary-img{width:56px;height:56px;object-fit:cover;border-radius:var(--rs);background:var(--card2)}
.summary-details{flex:1}
.summary-title{font-size:13px;font-weight:500}
.summary-qty{font-size:12px;color:var(--gray)}
.summary-price{font-family:'DM Mono',monospace;font-size:13px;color:var(--gold)}

.summary-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;color:var(--white2)}
.summary-row.total{border-top:1px solid var(--border2);margin-top:12px;padding-top:12px;font-size:16px;font-weight:700;color:var(--white)}

/* Payment Methods */
.payment-methods{display:flex;flex-direction:column;gap:10px}
.pm-option{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px;border:1px solid var(--border2);border-radius:var(--rs);
  cursor:pointer;background:var(--bg2);transition:.2s;
}
.pm-option:hover{border-color:var(--gold)}
.pm-option.active{border-color:var(--gold);background:var(--gold-dim)}
.pm-left{display:flex;align-items:center;gap:12px}

.cta-btn{
  width:100%;padding:16px;background:var(--gold);border:none;
  border-radius:var(--rs);color:#060606;font-family:'Oswald',sans-serif;
  font-size:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px;
}
.cta-btn:hover{background:var(--gold2);box-shadow:0 0 20px var(--gold-glow)}
.cta-btn:disabled{opacity:.5;cursor:not-allowed}

/* Error Notification Bar */
#error-bar{
  background:rgba(207,79,79,.15);border:1px solid var(--error);color:var(--error);
  padding:12px;border-radius:var(--rs);font-size:13px;margin-bottom:16px;display:none;
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="logo">
      <div class="logo-mark">GK</div>
      <span class="logo-name">Gosie Kartel</span>
    </a>
  </div>
</header>

<main>
  <div id="error-bar"></div>
  <form id="checkout-form">
    <div class="checkout-grid">
      
      <div class="left-col">
        <div class="card">
          <div class="card-header">
            <div class="card-header-num">1</div>
            <span class="card-title">Customer Information</span>
          </div>
          <div class="form-grid">
            <div class="field">
              <label for="cust-name">Full Name *</label>
              <input type="text" id="cust-name" placeholder="John Doe" required />
            </div>
            <div class="field">
              <label for="cust-email">Email Address *</label>
              <input type="email" id="cust-email" placeholder="john@example.com" required />
            </div>
          </div>
          <div class="field">
            <label for="cust-phone">Phone Number *</label>
            <input type="tel" id="cust-phone" placeholder="+263 77 123 4567" required />
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-header-num">2</div>
            <span class="card-title">Shipping Address</span>
          </div>
          <div class="field">
            <label for="cust-country">Country / Region *</label>
            <select id="cust-country" required onchange="handleCountryChange()">
              <option value="">Select Country</option>
            </select>
          </div>

          <div class="field">
            <label for="cust-address">Street Address *</label>
            <input type="text" id="cust-address" placeholder="123 Samora Machel Ave" required />
          </div>

          <div class="form-grid">
            <div class="field">
              <label for="cust-city">City *</label>
              <input type="text" id="cust-city" placeholder="Harare" required />
            </div>
            
            <div class="field" id="field-zip">
              <label for="cust-zip" id="zip-label">ZIP / Postal Code *</label>
              <input type="text" id="cust-zip" placeholder="00263" />
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-header-num">3</div>
            <span class="card-title">Select Payment Provider</span>
          </div>
          <div class="payment-methods">
            <label class="pm-option active" id="opt-dpo">
              <div class="pm-left">
                <input type="radio" name="payment_provider" value="dpo" checked />
                <span>DPO Pay (Global Cards, Visa, Mastercard)</span>
              </div>
            </label>
            <label class="pm-option" id="opt-paynow">
              <div class="pm-left">
                <input type="radio" name="payment_provider" value="paynow" />
                <span>Paynow (EcoCash, InnBucks, Zimswitch)</span>
              </div>
            </label>
            <label class="pm-option" id="opt-flutterwave">
              <div class="pm-left">
                <input type="radio" name="payment_provider" value="flutterwave" />
                <span>Flutterwave (International Cards & Wallets)</span>
              </div>
            </label>
          </div>
        </div>
      </div>

      <div class="right-col">
        <div class="card" style="position:sticky; top:84px;">
          <div class="card-header">
            <span class="card-title">Order Summary</span>
          </div>

          <div id="checkout-items"></div>

          <div class="summary-row" style="margin-top:16px;">
            <span>Subtotal</span>
            <span id="summary-subtotal">$0.00</span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span id="summary-shipping">$0.00</span>
          </div>
          <div class="summary-row total">
            <span>Total</span>
            <span id="summary-total" style="color:var(--gold); font-family:'DM Mono',monospace;">$0.00</span>
          </div>

          <div style="margin-top:24px;">
            <button type="submit" class="cta-btn" id="complete-btn">
              <span>Complete Payment</span>
            </button>
          </div>
        </div>
      </div>

    </div>
  </form>
</main>

<script src="js/checkout.js"></script>
<script src="js/payment-gateway.js"></script>

<script>
// Attach form listener
document.getElementById("checkout-form").addEventListener("submit", async function(e) {
  e.preventDefault();

  const customer = {
    name: document.getElementById("cust-name").value.trim(),
    email: document.getElementById("cust-email").value.trim(),
    phone: document.getElementById("cust-phone").value.trim(),
    country: document.getElementById("cust-country").value,
    city: document.getElementById("cust-city").value.trim(),
    address: document.getElementById("cust-address").value.trim(),
    zip: document.getElementById("cust-zip") ? document.getElementById("cust-zip").value.trim() : ""
  };

  const provider = document.querySelector('input[name="payment_provider"]:checked')?.value || 'dpo';

  try {
    // Triggers payment gateway redirect with user details & cart attached
    await window.GosiePaymentGateway.executePaymentRedirect(customer, provider);
  } catch (err) {
    alert(err.message || "An error occurred during payment processing.");
  }
});
</script>
</body>
</html>
