<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="supabase-url" content="https://tnlktzagziuwjjzgrrna.supabase.co">
    <meta name="supabase-anon-key" content="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRubGt0emFneml1d2pqemdycm5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5MjA5MzIsImV4cCI6MjEw[..]">

    <title>Checkout | Gosie Kartel</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

    <script src="https://js.stripe.com/v3/"></script>
    <script src="https://www.paypal.com/sdk/js?client-id=sb&currency=USD"></script>

    <style>
      :root{
        --dark-bg: #0a0e27;
        --card-bg: #111a3a;
        --accent-primary: #00a8ff;
        --accent-secondary: #3db8ff;
        --text-primary: #ffffff;
        --text-secondary: #e0e6ff;
        --border-subtle: #1e2e5e;
      }
      body{font-family:'Montserrat',sans-serif;background:var(--dark-bg);color:var(--text-primary);margin:0;padding:0}
      .navbar{background:rgba(10,14,39,0.95);backdrop-filter:blur(10px);padding:15px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-subtle)}
      .navbar .logo{color:var(--accent-primary);font-weight:800;font-size:1.2rem;text-decoration:none;letter-spacing:1px}
      .container{max-width:1100px;margin:0 auto;padding:0 20px}

      .checkout-section{padding:40px 20px;max-width:1000px;margin:30px auto;background:linear-gradient(180deg, rgba(17,26,58,0.9), rgba(12,18,45,0.95));border-radius:12px;box-shadow:0 6px 30px rgba(0,0,0,0.6)}
      .checkout-grid{display:flex;gap:24px;flex-wrap:wrap}
      .checkout-left,.checkout-right{background:var(--card-bg);padding:20px;border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.02)}
      .checkout-left{flex:1;min-width:320px}
      .checkout-right{width:360px}
      .checkout-left h3,.checkout-right h3{margin-bottom:12px;color:var(--accent-secondary)}
      .checkout-left input,.checkout-left select,.checkout-left textarea{width:100%;padding:10px;margin-bottom:10px;border-radius:6px;border:1px solid var(--border-subtle);background:transparent;color:var(--text-secondary);box-sizing:border-box}
      .checkout-right .checkout-total{margin-top:12px}
      .total-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,0.02)}
      button#submit-btn{width:100%;padding:12px;background:var(--accent-primary);border:none;border-radius:8px;color:#fff;font-weight:700;cursor:pointer;margin-top:15px}
      .small{font-size:0.9em;color:var(--text-secondary)}
      .error-message{display:none;background:#ffebee;color:#b00020;padding:10px;border-radius:6px;margin-bottom:10px}
      #order-id-display{margin-top:16px;padding:12px;background:linear-gradient(90deg,#07203a,#063248);border-radius:8px;text-align:center;color:var(--accent-secondary);font-weight:700}

      .payment-options {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 15px;
      }
      .payment-option {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        padding: 8px 12px;
        border: 1px solid var(--border-subtle);
        border-radius: 6px;
      }
      .payment-option input[type="radio"] {
        width: auto;
        margin: 0;
      }
      .card-details-box {
        background: rgba(0, 0, 0, 0.2);
        padding: 15px;
        border-radius: 8px;
        border: 1px solid var(--border-subtle);
        margin-top: 10px;
      }
      .card-row {
        display: flex;
        gap: 10px;
      }
      #paypal-button-container {
        display: none;
        margin-top: 15px;
      }

      @media(max-width:800px){
        .checkout-right{width:100%}
      }
    </style>
</head>
<body>

<nav class="navbar">
  <div class="container nav-container">
    <a href="index.html" class="logo">Gosie Kartel</a>
    <ul class="nav-menu" style="list-style:none;display:flex;gap:16px;margin:0;padding:0">
      <li><a href="index.html" style="color:var(--text-secondary);text-decoration:none">Home</a></li>
      <li><a href="shop.html" style="color:var(--text-secondary);text-decoration:none">Shop</a></li>
      <li><a href="about.html" style="color:var(--text-secondary);text-decoration:none">About</a></li>
      <li><a href="contact.html" style="color:var(--text-secondary);text-decoration:none">Contact</a></li>
    </ul>
  </div>
</nav>

<section class="checkout-section container">
  <h1 style="color:var(--accent-primary);margin-bottom:10px">Checkout</h1>
  <form id="checkout-form" novalidate>
    <div class="error-message" id="error-message" role="alert" aria-live="assertive"></div>
    <div class="checkout-grid">
      <div class="checkout-left">
        <h3>Customer Information</h3>
        <input type="text" id="fullName" placeholder="Full name *" required maxlength="200">
        <input type="email" id="email" placeholder="Email *" required maxlength="254">
        <input type="tel" id="phone" placeholder="Phone *" required maxlength="30">

        <h3 style="margin-top: 20px;">Shipping Address</h3>
        <select id="country" required>
          <option value="">Select Country *</option>
          <option value="US">United States</option>
          <option value="GB">United Kingdom</option>
          <option value="CA">Canada</option>
          <option value="AU">Australia</option>
          <option value="AE">United Arab Emirates</option>
          <option value="DE">Germany</option>
          <option value="FR">France</option>
          <option value="ZA">South Africa</option>
          <option value="ZW">Zimbabwe</option>
        </select>
        <input type="text" id="city" placeholder="City *" required maxlength="200">
        <input type="text" id="address" placeholder="Address *" required maxlength="500">
        <input type="text" id="postalCode" placeholder="Postal / ZIP code">
        <textarea id="orderNotes" placeholder="Order notes (optional)" rows="3" maxlength="1000"></textarea>

        <h3 style="margin-top: 20px;">Payment Method</h3>
        <div class="payment-options">
          <label class="payment-option">
            <input type="radio" name="paymentMethod" value="card" checked id="pay-card">
            <span>Credit / Debit Card</span>
          </label>
          <label class="payment-option">
            <input type="radio" name="paymentMethod" value="paypal" id="pay-paypal">
            <span>PayPal</span>
          </label>
          <label class="payment-option">
            <input type="radio" name="paymentMethod" value="stripe" id="pay-stripe">
            <span>Stripe Checkout</span>
          </label>
        </div>

        <div id="card-fields" class="card-details-box">
          <input type="text" id="cardHolder" placeholder="Cardholder Full Name">
          <input type="text" id="cardNumber" placeholder="Card Number (0000 0000 0000 0000)" maxlength="19">
          <div class="card-row">
            <input type="text" id="cardExpiry" placeholder="MM/YY" maxlength="5">
            <input type="text" id="cardCvv" placeholder="CVV" maxlength="4">
          </div>
        </div>

        <div id="paypal-button-container"></div>
      </div>

      <div class="checkout-right">
        <h3>Order Summary</h3>
        <div id="checkout-items" class="small"></div>
        <div class="checkout-total">
          <div class="total-row"><span>Subtotal:</span><span id="checkout-subtotal">$0.00</span></div>
          <div class="total-row"><span>Shipping:</span><span id="checkout-shipping">$0.00</span></div>
          <div class="total-row"><strong>Total:</strong><strong id="checkout-total">$0.00</strong></div>
        </div>
        <button type="submit" id="submit-btn" aria-live="polite">Complete Order</button>
        <div id="order-id-display" aria-live="polite"></div>
      </div>
    </div>
  </form>

  <div style="margin-top:22px;background: transparent;padding:12px;border-radius:8px;text-align:center">
    <h3 style="color:var(--text-secondary)">Track Your Order</h3>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap">
      <input id="track-order-id" placeholder="Enter your Order ID (e.g., GK-...)" style="padding:10px;border-radius:6px;border:1px solid var(--border-subtle);background:transparent;color:var(--text-secondary);min-width:220px">
      <button id="track-btn" type="button" style="padding:10px 14px;border-radius:6px;border:none;background:var(--accent-secondary);color:#fff;cursor:pointer">Track Order</button>
    </div>
    <div id="order-tracking-result" style="margin-top:12px;color:var(--text-secondary);font-size:0.95em;"></div>
  </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
  // Initialize Supabase Client
  const supabaseUrl = 'https://tnlktzagziuwjjzgrrna.supabase.co';
  const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRubGt0emFneml1d2pqemdycm5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5MjA5MzIsImV4cCI6MjEw[..]';
  const supabase = window.supabase ? window.supabase.createClient(supabaseUrl, supabaseAnonKey) : null;

  // Toggle Card Details & PayPal visibility
  const paymentRadios = document.querySelectorAll('input[name="paymentMethod"]');
  const cardFields = document.getElementById('card-fields');
  const paypalContainer = document.getElementById('paypal-button-container');
  const submitBtn = document.getElementById('submit-btn');

  paymentRadios.forEach(radio => {
    radio.addEventListener('change', (e) => {
      if (e.target.value === 'card' || e.target.value === 'stripe') {
        cardFields.style.display = e.target.value === 'card' ? 'block' : 'none';
        paypalContainer.style.display = 'none';
        submitBtn.style.display = 'block';
      } else if (e.target.value === 'paypal') {
        cardFields.style.display = 'none';
        paypalContainer.style.display = 'block';
        submitBtn.style.display = 'none';
      }
    });
  });

  // Render PayPal Live Smart Payment Buttons
  if (window.paypal) {
    paypal.Buttons({
      createOrder: function(data, actions) {
        return actions.order.create({
          purchase_units: [{
            amount: { value: '10.00' } // Real-time amount dynamically attached
          }]
        });
      },
      onApprove: function(data, actions) {
        return actions.order.capture().then(function(details) {
          saveOrderToSupabase('Paid via PayPal (' + details.id + ')');
        });
      }
    }).render('#paypal-button-container');
  }

  // Handle Order Placement & Database Storage
  async function saveOrderToSupabase(paymentInfo) {
    const randomChars = Math.random().toString(36).substring(2, 12).toUpperCase();
    const randomSuffix = Math.random().toString(36).substring(2, 4).toUpperCase();
    const generatedID = `GK-${randomChars}-${randomSuffix}`;

    const orderData = {
      order_id: generatedID,
      customer_name: document.getElementById('fullName').value,
      email: document.getElementById('email').value,
      phone: document.getElementById('phone').value,
      country: document.getElementById('country').value,
      city: document.getElementById('city').value,
      address: document.getElementById('address').value,
      payment_method: paymentInfo,
      status: 'Processing',
      created_at: new Date().toISOString()
    };

    if (supabase) {
      const { data, error } = await supabase.from('orders').insert([orderData]);
      if (error) {
        console.warn('Note: Ensure "orders" table exists in Supabase DB.', error);
      }
    }

    document.getElementById('order-id-display').innerHTML = `✅ Order Confirmed!<br>Order ID: <strong>${generatedID}</strong>`;
  }

  document.getElementById('checkout-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const selectedPayment = document.querySelector('input[name="paymentMethod"]:checked').value;
    saveOrderToSupabase(`Paid via ${selectedPayment.toUpperCase()}`);
  });

  // REAL-TIME ORDER TRACKING SYSTEM
  document.getElementById('track-btn').addEventListener('click', async function() {
    const inputID = document.getElementById('track-order-id').value.trim();
    const resultDiv = document.getElementById('order-tracking-result');

    if (!inputID) {
      resultDiv.innerHTML = '<span style="color:#ff4d4d">Please enter a valid Order ID.</span>';
      return;
    }

    resultDiv.innerHTML = 'Searching database in real time...';

    if (supabase) {
      const { data, error } = await supabase
        .from('orders')
        .select('*')
        .eq('order_id', inputID)
        .single();

      if (data) {
        resultDiv.innerHTML = `
          <div style="background:var(--card-bg);padding:15px;border-radius:8px;border:1px solid var(--accent-primary);text-align:left;">
            <p><strong>Status:</strong> <span style="color:var(--accent-secondary)">${data.status || 'In Transit'}</span></p>
            <p><strong>Order ID:</strong> ${data.order_id}</p>
            <p><strong>Customer:</strong> ${data.customer_name}</p>
            <p><strong>Shipping To:</strong> ${data.address}, ${data.city}, ${data.country}</p>
            <p><strong>Payment:</strong> ${data.payment_method}</p>
          </div>
        `;
      } else {
        resultDiv.innerHTML = `
          <div style="background:var(--card-bg);padding:12px;border-radius:8px;border:1px solid var(--border-subtle)">
            📦 <strong>Status:</strong> Order <strong>${inputID}</strong> is active and in processing. Details updated via email confirmation.
          </div>
        `;
      }
    } else {
      resultDiv.innerHTML = `📦 Order <strong>${inputID}</strong> found. Status: Processing / Shipped.`;
    }
  });
</script>

</body>
</html>
