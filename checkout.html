<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Gosie Kartel</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Gosie Kartel</a>
        </div>
    </nav>

    <section class="checkout-section">
        <div class="container">
            <h1>Checkout</h1>
            <form id="checkout-form" class="checkout-form">
                <div class="checkout-grid">
                    <div class="checkout-left">
                        <h3>Shipping Information</h3>
                        <input type="text" id="firstName" placeholder="First Name *" required>
                        <input type="text" id="lastName" placeholder="Last Name *" required>
                        <input type="email" id="email" placeholder="Email *" required>
                        <input type="tel" id="phone" placeholder="Phone *" required>
                        <input type="text" id="address" placeholder="Address *" required>
                        <input type="text" id="city" placeholder="City *" required>
                        <input type="text" id="zipCode" placeholder="ZIP Code *" required>
                        <select id="country" required>
                            <option value="">Select Country *</option>
                            <option value="US">United States</option>
                            <option value="UK">United Kingdom</option>
                            <option value="CA">Canada</option>
                            <option value="AU">Australia</option>
                            <option value="OTHER">Other</option>
                        </select>
                    </div>
                    <div class="checkout-right">
                        <h3>Order Summary</h3>
                        <div id="checkout-items"></div>
                        <div class="checkout-total">
                            <div class="total-row"><span>Total:</span><span id="checkout-total">$0.00</span></div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-large">Complete Order</button>
                    </div>
                </div>
            </form>
        </div>
    </section>

    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/orders.js"></script>
</body>
</html>
