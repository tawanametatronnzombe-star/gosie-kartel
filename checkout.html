    <title>Checkout | Gosie Kartel</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

    <style>
      /* Reuse core theme variables from index.html for consistent look */
      :root{
        --dark-bg: #0a0e27;
        --card-bg: #111a3a;
        --accent-primary: #00a8ff;
        --accent-secondary: #3db8ff;
        --text-primary: #ffffff;
        --text-secondary: #e0e6ff;
        --border-subtle: #1e2e5e;
      }
      body{font-family:'Montserrat',sans-serif;background:var(--dark-bg);color:var(--text-primary);margin:0;padding:0}
      .navbar{background:rgba(10,14,39,0.95);backdrop-filter:blur(10px);padding:15px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-subtle);position:sticky;top:0;z-index:100}
      .navbar .logo{color:var(--accent-primary);font-weight:800;font-size:1.2rem;text-decoration:none;letter-spacing:1px}
      .container{max-width:1100px;margin:0 auto;padding:0 20px}

      .checkout-section{padding:40px 20px;max-width:1000px;margin:30px auto;background:linear-gradient(180deg, rgba(17,26,58,0.9), rgba(12,18,45,0.95));border-radius:12px;box-shadow:0 6px 30px rgba(0,0,0,0.6);}
      .checkout-grid{display:flex;gap:24px;flex-wrap:wrap}
      .checkout-left,.checkout-right{background:var(--card-bg);padding:20px;border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.02)}
      .checkout-left{flex:1;min-width:320px}
      .checkout-right{width:360px}
      .checkout-left h3,.checkout-right h3{margin-bottom:12px;color:var(--accent-secondary)}
      .checkout-left input,.checkout-left select,.checkout-left textarea{width:100%;padding:10px;margin-bottom:10px;border-radius:6px;border:1px solid var(--border-subtle);background:transparent;color:var(--text-secondary)}
      .checkout-right .checkout-total{margin-top:12px}
      .total-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,0.02)}
      button#submit-btn{width:100%;padding:12px;background:var(--accent-primary);border:none;border-radius:8px;color:#fff;font-weight:700;cursor:pointer}
      .small{font-size:0.9em;color:var(--text-secondary)}
      .error-message{display:none;background:#ffebee;color:#b00020;padding:10px;border-radius:6px;margin-bottom:10px}
      #order-id-display{margin-top:16px;padding:12px;background:linear-gradient(90deg,#07203a,#063248);border-radius:8px;text-align:center;color:var(--accent-light)}

      @media(max-width:800px){
        .checkout-right{width:100%}
      }
    </style>

</head>
<body>

<nav class="navbar">
  <div class="container nav-container">
    <a href="index.html" class="logo">Gosie Kartel</a>
    <ul class="nav-menu" style="list-style:none;display:flex;gap:16px;margin:0;padding:0">
      <li><a href="index.html" style="color:var(--text-secondary);text-decoration:none">Home</a></li>
      <li><a href="shop.html" style="color:var(--text-secondary);text-decoration:none">Shop</a></li>
      <li><a href="about.html" style="color:var(--text-secondary);text-decoration:none">About</a></li>
      <li><a href="contact.html" style="color:var(--text-secondary);text-decoration:none">Contact</a></li>
    </ul>
  </div>
</nav>

<section class="checkout-section container">
  <h1 style="color:var(--accent-primary);margin-bottom:10px">Checkout</h1>
  <form id="checkout-form" novalidate>
    <div class="error-message" id="error-message" role="alert" aria-live="assertive"></div>
    <div class="checkout-grid">
      <div class="checkout-left">
        <h3>Shipping Information</h3>
        <input type="text" id="fullName" placeholder="Full name *" required maxlength="200">
        <input type="email" id="email" placeholder="Email *" required maxlength="254">
        <input type="tel" id="phone" placeholder="Phone *" required maxlength="30">
        <select id="country" required>
          <option value="">Select Country *</option>
        </select>
        <input type="text" id="city" placeholder="City *" required maxlength="200">
        <input type="text" id="address" placeholder="Address *" required maxlength="500">
        <input type="text" id="postalCode" placeholder="Postal / ZIP code">
        <textarea id="orderNotes" placeholder="Order notes (optional)" rows="3" maxlength="1000"></textarea>
      </div>

      <div class="checkout-right">
        <h3>Order Summary</h3>
        <div id="checkout-items" class="small"></div>
        <div class="checkout-total">
          <div class="total-row"><span>Subtotal:</span><span id="checkout-subtotal">$0.00</span></div>
          <div class="total-row"><span>Shipping:</span><span id="checkout-shipping">$0.00</span></div>
          <div class="total-row"><strong>Total:</strong><strong id="checkout-total">$0.00</strong></div>
        </div>
        <button type="submit" id="submit-btn" aria-live="polite">Complete Order</button>
        <div id="order-id-display" aria-live="polite"></div>
      </div>
    </div>
  </form>

  <div style="margin-top:22px;background:transparent;padding:12px;border-radius:8px;text-align:center">
    <h3 style="color:var(--text-secondary)">Track Your Order</h3>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap">
      <input id="track-order-id" placeholder="Enter your Order ID" style="padding:10px;border-radius:6px;border:1px solid var(--border-subtle);background:transparent;color:var(--text-secondary);min-width:220px">
      <button id="track-btn" type="button" style="padding:10px 14px;border-radius:6px;border:none;background:var(--accent-secondary);color:#fff;cursor:pointer">Track Order</button>
    </div>
    <div id="order-tracking-result" style="margin-top:12px;color:var(--text-secondary)"></div>
  </div>

</section>

<!-- Load libraries -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<!-- App scripts -->
<script src="js/supabase.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/email.js"></script>
<script src="js/checkout.js"></script>

</body>
</html>
