    <title>Checkout | Gosie Kartel</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        .checkout-section { padding:50px 20px; max-width:900px; margin:0 auto; background:#fff; border-radius:10px; margin-top:50px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
        #order-id-display { margin-top:20px; font-weight:bold; color:green; text-align:center; padding:15px; background:#e8f5e9; border-radius:5px; }
        .track-order-section { margin-top:40px; padding:20px; background:#f9f9f9; border-radius:10px; text-align:center; }
        .track-order-section input { padding:10px; width:300px; max-width:100%; border:1px solid #ccc; border-radius:5px; margin-right:10px; }
        .track-order-section button { padding:10px 20px; background:#0d6efd; color:white; border:none; border-radius:5px; cursor:pointer; }
        .order-status { margin-top:20px; padding:15px; background:#e3f2fd; border-radius:5px; text-align:left; }
        .status-timeline { margin-top:15px; }
        .status-step { display:flex; align-items:center; margin:10px 0; }
        .status-dot { width:20px; height:20px; border-radius:50%; background:#ccc; margin-right:15px; display:flex; align-items:center; justify-content:center; color:white; font-size:12px; }
        .status-dot.active { background:#4caf50; }
        .status-text { flex:1; }
        .checkout-grid { display:flex; flex-wrap:wrap; gap:20px; }
        .checkout-left, .checkout-right { flex:1; min-width:250px; }
        .checkout-left input, .checkout-left select, .checkout-left textarea { width:100%; padding:10px; margin-bottom:10px; border-radius:5px; border:1px solid #ccc; }
        .checkout-right .checkout-total { margin-top:20px; }
        .checkout-right .total-row { display:flex; justify-content:space-between; font-weight:bold; padding:5px 0; }
        .checkout-right button { width:100%; padding:12px; background:#0d6efd; color:#fff; border:none; border-radius:5px; cursor:pointer; margin-top:10px; font-size:1em; }
        .error-message { color: red; background: #ffe0e0; padding: 10px; border-radius: 5px; margin-bottom: 15px; display: none; }
        .success-box { background: #e8f5e9; padding:15px; border-radius:8px; margin-top:15px; text-align:center; }
        .small { font-size:0.9em; color:#555; }
    </style>
</head>
<body>
    
<nav class="navbar">
    <div class="container nav-container">
        <a href="index.html" class="logo">Gosie Kartel</a>
    </div>
</nav>

<section class="checkout-section">
    <h1>Checkout</h1>
    <form id="checkout-form" class="checkout-form" novalidate>
        <div class="error-message" id="error-message" role="alert" aria-live="assertive"></div>
        <div class="checkout-grid">
            <div class="checkout-left">
                <h3>Shipping Information</h3>
                <input type="text" id="fullName" placeholder="Full name *" required>
                <input type="email" id="email" placeholder="Email *" required>
                <input type="tel" id="phone" placeholder="Phone *" required>
                <select id="country" required>
                    <option value="">Select Country *</option>
                    <option value="US">United States</option>
                    <option value="UK">United Kingdom</option>
                    <option value="CA">Canada</option>
                    <option value="AU">Australia</option>
                    <option value="DE">Germany</option>
                    <option value="FR">France</option>
                    <option value="ZA">South Africa</option>
                    <option value="OTHER">Other</option>
                </select>
                <input type="text" id="city" placeholder="City *" required>
                <input type="text" id="address" placeholder="Address *" required>
                <input type="text" id="postalCode" placeholder="Postal / ZIP code" style="display:none;">
                <textarea id="orderNotes" placeholder="Order notes (optional)" rows="3"></textarea>
            </div>
            <div class="checkout-right">
                <h3>Order Summary</h3>
                <div id="checkout-items"></div>
                <div class="checkout-total">
                    <div class="total-row"><span>Subtotal:</span><span id="checkout-subtotal">$0.00</span></div>
                    <div class="total-row"><span>Shipping:</span><span id="checkout-shipping">$0.00</span></div>
                    <div class="total-row"><strong>Total:</strong><strong id="checkout-total">$0.00</strong></div>
                </div>
                <button type="submit" id="submit-btn" aria-live="polite">Complete Order</button>
            </div>
        </div>
    </form>
    <div id="order-id-display" aria-live="polite"></div>

    <!-- Track Order Section -->
    <div class="track-order-section">
        <h3>Track Your Order</h3>
        <p>Enter your Order ID to track your shipment status</p>
        <div style="margin-top:15px;">
            <input type="text" id="track-order-id" placeholder="Enter your Order ID">
            <button type="button" id="track-btn">Track Order</button>
        </div>
        <div id="order-tracking-result"></div>
    </div>
</section>

<!-- EmailJS Library (v4) -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<!-- Your files -->
<script src="js/supabase.js"></script>

<script src="js/checkout.js"></script>

</body>
</html>
