<script>
    function generateOrderId() {
        return "ORD-" + Date.now().toString();
    }

    // Calculate shipping cost
    function calculateShipping(subtotal, country) {
        if (subtotal > 100) return 0;
        const rates = {
            "US": 10,
            "UK": 15,
            "CA": 12,
            "AU": 20,
            "OTHER": 25
        };
        return rates[country] || 25;
    }

    // Update checkout items and total
    function renderCheckoutItems() {
        const cartItems = JSON.parse(localStorage.getItem("cart")) || [];
        const container = document.getElementById("checkout-items");
        const subtotalEl = document.getElementById("checkout-subtotal");
        const shippingEl = document.getElementById("checkout-shipping");
        const totalEl = document.getElementById("checkout-total");
        
        container.innerHTML = "";
        let subtotal = 0;

        if (cartItems.length === 0) {
            container.innerHTML = '<p style="color: #999;">Your cart is empty. <a href="shop.html">Continue shopping</a></p>';
            subtotalEl.textContent = "$0.00";
            shippingEl.textContent = "$0.00";
            totalEl.textContent = "$0.00";
            return;
        }

        cartItems.forEach(item => {
            const div = document.createElement("div");
            div.style.cssText = "display: flex; justify-content: space-between; margin-bottom: 10px;";
            div.innerHTML = `
                <span>${item.name}</span>
                <span>$${item.price.toFixed(2)}</span>
            `;
            container.appendChild(div);
            subtotal += item.price;
        });

        const country = document.getElementById("country").value || "US";
        const shipping = calculateShipping(subtotal, country);
        const total = subtotal + shipping;

        subtotalEl.textContent = `$${subtotal.toFixed(2)}`;
        shippingEl.textContent = shipping === 0 ? "FREE" : `$${shipping.toFixed(2)}`;
        totalEl.textContent = `$${total.toFixed(2)}`;
    }

    // Get order status based on order age
    function getOrderStatus(orderId) {
        const orders = JSON.parse(localStorage.getItem("orders")) || [];
        const order = orders.find(o => o.orderId === orderId);
        
        if (!order) {
            return null;
        }

        const orderTime = new Date(order.createdAt).getTime();
        const now = Date.now();
        const daysSinceOrder = Math.floor((now - orderTime) / (1000 * 60 * 60 * 24));

        let status = "Processing";
        let progress = 1;
        
        if (daysSinceOrder >= 7) {
            status = "Delivered";
            progress = 4;
        } else if (daysSinceOrder >= 5) {
            status = "Out for Delivery";
            progress = 3;
        } else if (daysSinceOrder >= 2) {
            status = "In Transit";
            progress = 2;
        }

        return { ...order, status, progress, daysSinceOrder };
    }

    // Track order function
    function trackOrder() {
        const orderId = document.getElementById("track-order-id").value.trim();
        const resultContainer = document.getElementById("order-tracking-result");
        resultContainer.innerHTML = "";
