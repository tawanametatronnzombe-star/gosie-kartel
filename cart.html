<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | Gosie Kartel</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">Gosie Kartel</a>
            <nav>
                <ul style="display: flex; gap: 15px; list-style: none; margin: 0; padding: 0;">
                    <li><a href="index.html" style="color: #a0aec0; text-decoration: none;">HOME</a></li>
                    <li><a href="shop.html" style="color: #a0aec0; text-decoration: none;">SHOP</a></li>
                    <li><a href="cart.html" style="color: #fff; text-decoration: none;">CART</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main style="max-width: 800px; margin: 0 auto; padding: 0 15px;">
        <h1 style="font-size: 2em; margin-bottom: 20px;">Shopping Cart</h1>

        <div class="order-summary-card" style="margin-bottom: 20px;">
            <div id="empty-cart" style="display: none; text-align: center; padding: 20px; color: #a0aec0;">
                Your cart is currently empty. <a href="shop.html" style="color: #0d6efd;">Go shopping</a>
            </div>

            <div id="cart-items" style="display: flex; flex-direction: column; gap: 15px;">
                <!-- Cart items load here dynamically -->
            </div>

            <hr style="border: 0; border-top: 1px solid #30363d; margin: 20px 0;">

            <div style="display: flex; flex-direction: column; gap: 10px;">
                <div style="display: flex; justify-content: space-between;">
                    <span style="color: #a0aec0;">Subtotal:</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <span style="color: #a0aec0;">Shipping:</span>
                    <span id="shipping">$0.00</span>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 1.2em; font-weight: bold; margin-top: 10px;">
                    <span>Total:</span>
                    <span id="total">$0.00</span>
                </div>
            </div>

            <a href="checkout.html" id="checkout-btn" class="payment-method-btn" style="background: #0d6efd; padding: 15px; text-align: center; text-decoration: none; font-weight: bold; margin-top: 20px; display: block;">PROCEED TO CHECKOUT</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Gosie Kartel | All prices in USD.</p>
        <p class="footer-email">Contact: tawanametatronnzombe@gmail.com</p>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
